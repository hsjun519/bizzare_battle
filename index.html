<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d0915" />
    <meta name="description" content="철학자와 자본가가 맞붙는 아케이드 대전 격투 게임. 상대의 기술을 논파해 빼앗고, 라운드마다 세계의 법칙이 바뀐다." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>BIZZARE BATTLE — 철학 vs 자본</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bungee&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07050c;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff8ec;
        font: 700 18px/1.5 "Noto Sans KR", sans-serif;
        letter-spacing: 0.08em;
        transition: opacity 0.4s;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      noscript {
        color: #fff;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="BIZZARE BATTLE 게임 화면"></canvas>
    <div id="boot">LOADING…</div>
    <noscript>이 게임은 JavaScript가 필요합니다.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
